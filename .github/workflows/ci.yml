name: KnowledgeHub CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linting
        run: |
          ruff check backend/app backend/eval backend/tests

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest backend/tests/ -v --durations=10

      - name: Run Evaluation Benchmark
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci
        run: |
          python backend/eval/run_eval.py

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build
